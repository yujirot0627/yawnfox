# fly.toml app configuration file generated for backend-fragrant-paper-2193 on 2025-04-18T17:13:07+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backend-fragrant-paper-2193'
primary_region = 'otp'

[env]
  PORT = '8080'

# The start command is defined by the Docker image CMD (see Dockerfile):
#   uvicorn main:app --host 0.0.0.0 --port 8080 --ws-max-size 65536 --no-proxy-headers
# --ws-max-size caps WebSocket frames at 64 KB (protocol layer); --no-proxy-headers
# stops uvicorn from rewriting the peer IP from X-Forwarded-For (the app derives the
# client IP itself from fly-client-ip; see _client_ip / TRUST_XFF).

[http_service]
  internal_port = 8080
  force_https = true
  # Keep at least one machine warm and let Fly auto-start more under load.
  # (auto_stop_machines accepts 'off' | 'stop' | 'suspend'.)
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Autoscale on concurrent (WebSocket) connections per machine.
  [http_service.concurrency]
    type = 'connections'
    soft_limit = 200
    hard_limit = 250

# --- A note on "sticky sessions" -------------------------------------------
# Fly.toml has no `sticky_sessions` key. It is also not needed here: each client
# uses a single long-lived WebSocket, and Fly Proxy keeps an established
# WebSocket pinned to the machine it landed on for the life of the connection.
# Cross-machine matchmaking + signaling state is shared through Redis
# (store.py: shared keys + pub/sub relay), so two matched peers can sit on
# different machines and still exchange SDP/ICE. Scale out with:
#     fly scale count 2
# ---------------------------------------------------------------------------

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
